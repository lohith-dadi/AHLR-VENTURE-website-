<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64" role="img" aria-label="AHLR Venture Logo">
  <!-- House Roofline & Architecture Mark -->
  <g transform="translate(6, 6)">
    <!-- Chimney accent -->
    <path d="M 33 23 V 15 H 39 V 28.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- House body / foundation -->
    <path d="M 11 35 V 45 H 39 V 35" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gold architectural roofline -->
    <path d="M 4 35 L 25 14 L 46 35" fill="none" stroke="#D9A02B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner doorway / bridge -->
    <path d="M 21 45 V 34 H 29 V 45" fill="#D9A02B"/>
    <!-- Small window / cornerstone -->
    <circle cx="25" cy="24" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Geometric Typography matching Jost -->
  <text x="66" y="35" font-family="'Jost', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="0.06em">AHLR</text>
  <text x="67" y="51" font-family="'Jost', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#D9A02B" letter-spacing="0.28em">VENTURE</text>
</svg>
